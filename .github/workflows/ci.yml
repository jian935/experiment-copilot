# 持续集成：把「可证伪」变成每次 push 都跑一遍的事实
#
# 三件事，按失败时的诊断价值排序：
#   1. 单测           —— 统计量对齐权威实现、决策规则不被悄悄改坏
#   2. 基线比对       —— 评测指标（准确率 / FPR / 分层 F1 / 幻觉数字率）漂移即红，
#                        并直接打印是哪一个指标从多少变到多少
#   3. 数据可复现     —— 重跑生成器后指标必须与基线逐位一致；不一致说明数据不再是确定的
#
# 注意：CI 只用**规则模式**跑 Agent 评测（不需要 API Key，完全确定性）。
# 智能模式的 ablation 有随机性，不进 CI，只人工看并记录在 docs/ABLATION-NOTES.md。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 部署 Pages 需要这两个权限；显式写 permissions 会覆盖默认值，所以 contents 也要写回来。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · eval baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生成前端数据（public/data 是构建产物，不进仓库）
        # 2026-11-05 首次推送到 GitHub 时 CI 红在这里：tests/dimensions / metricDict / taskEval
        # 直接读 `public/data/dataset.json`，而 `public/data/` 整个目录在 .gitignore 里。
        # 本地一直绿是因为跑过 build；CI 是干净 checkout，没有这个文件。
        # 修法不是把 1.7MB 派生物塞进仓库，而是让 CI 按真实构建顺序先生成它。
        run: npm run data

      - name: 单测（统计 / 决策 / 证据 / Agent / 导入 / 评测 / 基线）
        run: npm test

      - name: 评测指标与基线比对
        # 失败时输出形如 `✗ accuracy 93.33% → 91.67%（-1.67pp）`，
        # 直接指出是哪个指标动了；有意改口径就用 npm run eval:baseline 更新基线并写明原因
        run: npm run eval:check

      - name: 生成物与源码同步（重跑生成器，忽略时间戳后逐位比对）
        # 补的是「指标没变、但生成物文件悄悄变旧」这个盲区：
        # 2026-11-04 全量巡检发现 novelty_report.json 比代码少了 3 个 unit 字段，
        # 而 eval:check 的 38 项指标全绿——它只比对指标，不比对生成物本身。
        # 检查跑完会把文件还原，CI 里不会留下改动；有意更新用 --sync 并一起提交。
        run: npm run check:generated

      - name: 数据可复现性（重跑生成器后指标必须不变）
        # 生成器的随机流一旦被改动（加字段、改抽样顺序），这批数据就不再是同一批，
        # 所有对外数字都要重测。这里让它在 CI 里直接红，而不是等人发现文档对不上。
        run: npm run gen && npm run eval:check

      - name: A/A 冒烟（200 次零效应实验）
        # 不是精确测误报率（200 次的分辨率太粗），而是确认引擎没被改成「一跑 A/A 就报显著」
        run: npm run aa -- 200 --dry

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            data/agent_eval.json
            data/aa_report.json
            eval/baseline.json
          if-no-files-found: ignore

  # Pages 部署放在 CI 之后而不是单独一个 workflow，理由就一条：
  # CI 红了就不许上线。单独跑的话，一个把准确率改坏、或者基线对不上的提交
  # 照样会被部署出去——而这套东西对外说的就是「可证伪」。
  # 只在 main 上部署（PR 只验证不发布）。
  deploy:
    name: deploy to Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 构建（base './' + hash 路由，子路径 /experiment-copilot/ 直接可开）
        run: npm ci && npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
